---
- name: Deploy MetalLB
  when: k8s_load_balancer_plugin == 'metallb'
  block:
    - name: Apply MetalLB manifests
      ansible.builtin.command: kubectl apply -f https://raw.githubusercontent.com/metallb/metallb/v0.14.5/config/manifests/metallb-native.yaml
      register: metallb_manifests_result
      changed_when: "'created' in metallb_manifests_result.stdout or 'configured' in metallb_manifests_result.stdout"
      until: metallb_manifests_result is succeeded
      retries: 5
      delay: 10

    - name: Wait for MetalLB controller to be ready
      ansible.builtin.command: kubectl wait --for=condition=ready pod -l app=metallb,component=controller -n metallb-system --timeout=300s
      register: metallb_wait_result
      changed_when: false
      until: metallb_wait_result.rc == 0
      retries: 3

    - name: Create MetalLB IPAddressPool configuration
      ansible.builtin.template:
        src: metallb-ipaddresspool.yaml.j2
        dest: /tmp/metallb-ipaddresspool.yaml
        mode: '0644'

    - name: Apply MetalLB IPAddressPool
      ansible.builtin.command: kubectl apply -f /tmp/metallb-ipaddresspool.yaml
      register: metallb_pool_result
      changed_when: "'created' in metallb_pool_result.stdout or 'configured' in metallb_pool_result.stdout"

    - name: Create MetalLB L2Advertisement configuration
      ansible.builtin.template:
        src: metallb-l2advertisement.yaml.j2
        dest: /tmp/metallb-l2advertisement.yaml
        mode: '0644'

    - name: Apply MetalLB L2Advertisement
      ansible.builtin.command: kubectl apply -f /tmp/metallb-l2advertisement.yaml
      register: metallb_l2_result
      changed_when: "'created' in metallb_l2_result.stdout or 'configured' in metallb_l2_result.stdout"
